<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-label="Bolsines: recepción de bolsines entre comisiones médicas">
  <style>
    .titulo { font: 800 92px/1 'Encode Sans', 'Segoe UI', system-ui, sans-serif; fill: #fff; letter-spacing: -2px; }
    .bajada { font: 500 26px/1.3 'Encode Sans', 'Segoe UI', system-ui, sans-serif; fill: #c9d2ff; }
    .meta { font: 600 17px/1 'Encode Sans', 'Segoe UI', system-ui, sans-serif; fill: #8fa0ff; }
    .numero { font: 800 34px/1 'Encode Sans', 'Segoe UI', system-ui, sans-serif; fill: #1b2230; letter-spacing: 1px; }
    .rotulo { font: 700 13px/1 'Encode Sans', 'Segoe UI', system-ui, sans-serif; fill: #1b2230; opacity: .65; letter-spacing: 1px; }
    .sello { font: 900 30px/1 'Encode Sans', 'Segoe UI', system-ui, sans-serif; fill: none; letter-spacing: 4px; }
    .precinto { transform-origin: 1010px 38px; animation: hamaca 4.8s ease-in-out infinite; }
    .precinto.b { transform-origin: 1150px 38px; animation-delay: -1.6s; animation-duration: 5.6s; }
    .golpe { transform-origin: 830px 300px; animation: golpe 6s cubic-bezier(.2,.9,.3,1) infinite; }
    @keyframes hamaca { 0%,100% { transform: rotate(-5deg) } 50% { transform: rotate(5deg) } }
    @keyframes golpe {
      0%, 12% { opacity: 0; transform: rotate(-24deg) scale(2) }
      20% { opacity: 1; transform: rotate(-9deg) scale(1) }
      85% { opacity: 1; transform: rotate(-9deg) scale(1) }
      100% { opacity: 0; transform: rotate(-9deg) scale(1) }
    }
    @media (prefers-reduced-motion: reduce) { .precinto, .golpe { animation: none } }
  </style>
  <defs>
    <pattern id="lona" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8 L8 0" stroke="#fff" stroke-opacity=".05" />
    </pattern>
    <linearGradient id="brillo" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35" />
      <stop offset=".4" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="1280" height="380" rx="28" fill="#1f319a" />
  <rect width="1280" height="380" rx="28" fill="url(#lona)" />
  <rect x="900" y="30" width="330" height="10" rx="5" fill="#34459f" />

  <!-- marca -->
  <g transform="translate(64 64)">
    <rect width="56" height="56" rx="14" fill="#2e46c8" stroke="#4a60dd" />
    <path d="M19 15h18v8a9 9 0 0 1-18 0z" fill="none" stroke="#f5c400" stroke-width="4" stroke-linejoin="round" />
    <rect x="13" y="30" width="30" height="13" rx="3" fill="#f5c400" />
  </g>
  <text class="meta" x="136" y="99">PPAI DSI 2026 · UTN FRC · Grupo 4</text>
  <text class="titulo" x="60" y="218">Bolsines</text>
  <text class="bajada" x="64" y="268">Registrar la recepción de un bolsín, documento por documento.</text>
  <text class="bajada" x="64" y="302">CU 28 con patrón State · Spring Boot + React</text>

  <!-- precintos colgando del perchero -->
  <g class="precinto">
    <line x1="1010" y1="38" x2="1010" y2="92" stroke="#c79f00" stroke-width="4" />
    <rect x="950" y="92" width="120" height="150" rx="14" fill="#f5c400" />
    <rect x="950" y="92" width="120" height="150" rx="14" fill="url(#brillo)" />
    <circle cx="1010" cy="110" r="7" fill="#1f319a" />
    <text class="rotulo" x="1010" y="150" text-anchor="middle">PRECINTO</text>
    <text class="numero" x="1010" y="190" text-anchor="middle" textLength="96" lengthAdjust="spacingAndGlyphs">004512</text>
    <g fill="#8a6d00" opacity=".3"><rect x="972" y="206" width="7" height="22" rx="2" /><rect x="988" y="206" width="7" height="22" rx="2" /><rect x="1004" y="206" width="7" height="22" rx="2" /><rect x="1020" y="206" width="7" height="22" rx="2" /><rect x="1036" y="206" width="7" height="22" rx="2" /></g>
  </g>
  <g class="precinto b">
    <line x1="1150" y1="38" x2="1150" y2="70" stroke="#c79f00" stroke-width="4" />
    <rect x="1098" y="70" width="104" height="130" rx="12" fill="#f5c400" />
    <rect x="1098" y="70" width="104" height="130" rx="12" fill="url(#brillo)" />
    <circle cx="1150" cy="86" r="6" fill="#1f319a" />
    <text class="rotulo" x="1150" y="122" text-anchor="middle">PRECINTO</text>
    <text class="numero" x="1150" y="158" text-anchor="middle" style="font-size:26px" textLength="82" lengthAdjust="spacingAndGlyphs">004533</text>
  </g>

  <!-- el sello que cae -->
  <g class="golpe">
    <rect x="720" y="262" width="220" height="80" rx="14" fill="none" stroke="#ffd84a" stroke-width="5" />
    <line x1="738" y1="282" x2="922" y2="282" stroke="#ffd84a" stroke-width="2" />
    <line x1="738" y1="322" x2="922" y2="322" stroke="#ffd84a" stroke-width="2" />
    <text class="sello" x="830" y="313" text-anchor="middle" stroke="#ffd84a" stroke-width="1.6">RECIBIDO</text>
  </g>
</svg>
